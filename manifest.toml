# --- Core components ---

[[components]]
name = "hypr"
default = true
packages = [
    "hyprland",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "ttf-jetbrains-mono-nerd",
]
post_install = [
    "hyprctl reload >/dev/null",
    "hyprpm update",
    "hyprpm reload"
]
post_update = [
    "hyprctl reload >/dev/null",
    "hyprpm update",
    "hyprpm reload"
]
[[components.entries]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"
[[components.entries]]
src = "xdg-desktop-portal"
dest = "$XDG_CONFIG_HOME/xdg-desktop-portal"

[[components]]
name = "caelestia"
default=true
packages = ["local:shell"]
post_install = [
    "test -f ${XDG_STATE_HOME:-$HOME/.local/state}/caelestia/scheme.json || caelestia scheme set -n caelestia",
    "caelestia shell -k >/dev/null; sleep 1; caelestia shell -d >/dev/null",
]
post_update = [
    "caelestia shell -k >/dev/null; sleep 1; caelestia shell -d >/dev/null",
]
[[components.entries]]
src = "caelestia"
dest = "$XDG_CONFIG_HOME/caelestia"

[[components]]
name = "system"
default = true
packages = ["gnome-keyring", "networkmanager", "bluez", "bluez-utils"]

[[components]]
name = "audio"
default = true
packages = [
    "pipewire",
    "pipewire-pulse",
    "pipewire-audio",
    "pipewire-alsa",
    "pipewire-jack",
    "wireplumber",
    "pwvucontrol",
    "playerctl"
]
[[components.entries]]
src = "wireplumber"
dest = "$XDG_CONFIG_HOME/wireplumber"

[[components]]
name = "monitor"
default = true
packages = ["btop", "nvtop", "ncdu"]
post_install = ["killall -USR2 btop 2>/dev/null || true"]
post_update = ["killall -USR2 btop 2>/dev/null || true"]
[[components.entries]]
src = "btop"
dest = "$XDG_CONFIG_HOME/btop"

[[components]]
name = "fish"
default = true
packages = ["fish", "eza", "zoxide", "direnv"]
[[components.entries]]
src = "fish"
dest = "$XDG_CONFIG_HOME/fish"

[[components]]
name = "foot"
default = true
packages = ["foot", "fish", "ttf-jetbrains-mono-nerd"]
[[components.entries]]
src = "foot"
dest = "$XDG_CONFIG_HOME/foot"

[[components]]
name = "micro"
default = true
packages = ["micro"]
[[components.entries]]
src = "micro"
dest = "$XDG_CONFIG_HOME/micro"
[[components.entries]]
src = "applications/micro.desktop"
dest = "$XDG_DATA_HOME/applications/micro.desktop"

[[components]]
name = "thunar"
default = true
packages = ["thunar", "thunar-archive-plugin", "sshfs"]
[[components.entries]]
src = "thunar"
dest = "$XDG_CONFIG_HOME/Thunar"
[[components.entries]]
src = "mimeapps.list"
dest = "$XDG_CONFIG_HOME/mimeapps.list"
[[components.entries]]
src = "xfce4"
dest = "$XDG_CONFIG_HOME/xfce4"

[[components]]
name = "yazi"
default = true
packages = ["yazi", "7zip", "ffmpeg"]
[[components.entries]]
src = "yazi"
dest = "$XDG_CONFIG_HOME/yazi"

[[components]]
name = "pacseek"
default = true
packages = ["pacseek"]
[[components.entries]]
src = "pacseek"
dest = "$XDG_CONFIG_HOME/pacseek"

[[components]]
name = "fastfetch"
default = true
packages = ["fastfetch"]
[[components.entries]]
src = "fastfetch"
dest = "$XDG_CONFIG_HOME/fastfetch"

[[components]]
name = "starship"
default = true
packages = ["starship"]
[[components.entries]]
src = "starship.toml"
dest = "$XDG_CONFIG_HOME/starship.toml"

[[components]]
name = "udiskie"
default = true
packages = ["udiskie"]
[[components.entries]]
src = "udiskie"
dest = "$XDG_CONFIG_HOME/udiskie"

[[components]]
name = "gtk"
default = true
packages = ["adw-gtk-theme", "papirus-icon-theme", "papirus-folders"]

[[components]]
name = "qt"
default = true
packages = [
    "qtengine-git",
    "frameworkintegration",
    "darkly-bin",
    "papirus-icon-theme",
    "papirus-folders",
]

[[components]]
name = "fonts"
default = true
packages = ["noto-fonts", "noto-fonts-cjk", "noto-fonts-emoji"]

[[components]]
name = "clipboard"
default = true
packages = ["wl-clipboard", "cliphist", "wtype"]

[[components]]
name = "gaming"
default = true
packages = ["cachyos-gaming-applications", "gamemode", "hyprland-focused-booster", "gamescope-session-cachyos", "flatpak"]
post_install = [
    "flatpak install -y net.retrodeck.retrodeck",
    "steamos-session-select persistent",
    "curl -L https://github.com/SteamDeckHomebrew/decky-installer/releases/latest/download/install_release.sh | sh",
]
[[components.entries]]
src = "gaming/gamerun"
dest = "/usr/local/bin/gamerun"
sudo=true
[[components.entries]]
src = "gaming/booster"
dest = "/usr/local/bin/booster"
sudo=true
[[components.entries]]
src = "mangohud"
dest = "$XDG_CONFIG_HOME/MangoHud"
[[components.entries]]
src = "gaming/gamemode.ini"
dest = "/usr/share/gamemode/gamemode.ini"
sudo=true
[[components.entries]]
src = "gaming/scx_loader.toml"
dest = "/etc/scx_loader/config.toml"
sudo=true
[[components.entries]]
src = "gaming/gaming"
dest = "/etc/sudoers.d/gaming"
sudo=true
[[components.entries]]
src = "steamos/steam-set-session"
dest = "/usr/lib/steamos/steam-set-session"
sudo=true
[[components.entries]]
src = "steamos/steamos-session-select"
dest = "/usr/bin/steamos-session-select"
sudo=true
[[components.entries]]
src = "homebrew"
dest = "$HOME/homebrew"
[[components.entries]]
src = "gaming/dlo"
dest = "$HOME/.dlo"
[[components.entries]]
src = "gaming/30-amdgpu-perf.rules"
dest = "/etc/udev/rules.d/30-amdgpu-perf.rules"
sudo=true
[[components.entries]]
src = "gaming/override.conf"
dest = "$XDG_CONFIG_HOME/systemd/user/hyprland-focused-booster.service.d/override.conf"

[[components]]
name = "systemd"
default = true
packages = ["uwsm", "app2unit"]
[[components.entries]]
src = "uwsm"
dest = "$XDG_CONFIG_HOME/uwsm"
[[components.entries]]
src = "environment.d"
dest = "$XDG_CONFIG_HOME/environment.d"

[[components]]
name = "tools"
default = true
packages = [
    "git",
    "curl",
    "trash-cli",
    "jq",
    "lazygit",
    "bat",
    "ripgrep",
    "ydotool",
    "hyprpicker",
    "hyprsunset",
    "xdg-user-dirs",
]
post_install = [
    "xdg-user-dirs-update", 
    'git clone https://github.com/GwynnN7/Wallpaper "$HOME/Pictures/Wallpaper" 2>/dev/null || git -C "$HOME/Pictures/Wallpaper" pull'
    ]
post_update = [
    "xdg-user-dirs-update",
    'git clone https://github.com/GwynnN7/Wallpaper "$HOME/Pictures/Wallpaper" 2>/dev/null || git -C "$HOME/Pictures/Wallpaper" pull'
]

# --- Optional components ---

[[components]]
name = "plymouth"
packages = ["plymouth", "plymouth-theme-darth-vader-git"]
post_install = [
    "sudo plymouth-set-default-theme -R darth_vader",
]

[[components]]
name = "greetd"
packages = [
    "greetd",
    "greetd-tuigreet"
]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl enable --now greetd.service || true"
]
[[components.entries]]
src = "greetd/config.toml"
dest = "/etc/greetd/config.toml"
sudo = true
[[components.entries]]
src = "greetd/greetd-switcher"
dest = "/usr/local/bin/greetd-switcher"
sudo = true

[[components]]
name = "sddm"
packages = [
    "sddm",
    "caelestia-sddm-minimalistv2-git",
    "layer-shell-qt"
]
post_install = [
    "sudo systemctl daemon-reload",
    "sudo systemctl enable --now sddm.service || true",
    "sudo /usr/share/sddm/themes/caelestia/scripts/sync.sh >/dev/null"
]
post_update = [
    "sudo /usr/share/sddm/themes/caelestia/scripts/sync.sh >/dev/null"
]
[[components.entries]]
src = "sddm/caelestia.conf"
dest = "/etc/sddm.conf.d/caelestia.conf"
sudo = true
[[components.entries]]
src = "sddm/sddm.lua"
dest = "/opt/hypr/sddm.lua"
sudo = true
[[components.entries]]
src = "sddm/caelestia-sddm"
dest = "/etc/sudoers.d/caelestia-sddm"
sudo = true

[[components]]
name = "software"
packages = ["tidal-hifi-bin", "zen-browser-bin", "telegram-desktop", "equibop"]
[[components.entries]]
src = "applications/zen.desktop"
dest = "$XDG_DATA_HOME/applications/zen.desktop"

[[components]]
name = "applications"
packages = ["gimp", "vlc", "celluloid", "loupe", "evince", "file-roller", "gparted", "xorg-xhost"]

[[components]]
name = "development"
packages = ["visual-studio-code-bin", "git", "github-cli", "android-tools", "eigen", "openblas", "python-numpy", "python-pandas", "python-matplotlib"]
post_install = [
    "code --install-extension $CAELESTIA_DOTS/vscode/caelestia-vscode-integration/caelestia-vscode-integration-*.vsix",
]
[[components.entries]]
src = "vscode/settings.json"
dest = "$XDG_CONFIG_HOME/Code/User/settings.json"
[[components.entries]]
src = "vscode/keybindings.json"
dest = "$XDG_CONFIG_HOME/Code/User/keybindings.json"
[[components.entries]]
src = "vscode/flags.conf"
dest = "$XDG_CONFIG_HOME/code-flags.conf"

[[components]]
name = "kdeconnect"
packages = ["kdeconnect", "local:kdeconnect"]
post_install = [
    "systemctl --user daemon-reload",
    "systemctl --user stop hypr-kdeconnect-portal.service",
    "systemctl --user restart xdg-desktop-portal"
]

[[components]]
name = "hyprpm"
packages = []
post_install = [
    "hyprpm purge-cache",
    "hyprpm reload",
    "hyprpm update",
    "hyprpm add https://github.com/zjeffer/split-monitor-workspaces || true",
    "hyprpm add https://github.com/yayuuu/hyprland-scroll-overview || true",
    "hyprpm add https://github.com/gfhdhytghd/hymission || true",
    "hyprpm enable split-monitor-workspaces || true",
    "hyprpm enable scrolloverview || true",
    "hyprpm enable hymission || true",
    "hyprpm reload"
]

[[components]]
name = "retrodeck-bios"
packages = ["flatpak"]
post_install = [
    "flatpak install -y net.retrodeck.retrodeck",
    "flatpak override --user --talk-name=org.freedesktop.Flatpak net.retrodeck.retrodeck",
    "mkdir -p $HOME/Games/Retrodeck/Switch",
    "mkdir -p $HOME/Games/Retrodeck/retrodeck/roms/apps",
    "curl -fsSL https://raw.githubusercontent.com/Abdess/retrobios/main/install.sh | sh -s -- --platform retrodeck --dest $HOME/Games/Retrodeck/retrodeck/bios"
]
[[components.entries]]
src = "retrodeck/es_systems.xml"
dest = "$HOME/.var/app/net.retrodeck.retrodeck/config/ES-DE/custom_systems/es_systems.xml"
[[components.entries]]
src = "retrodeck/Switch.sh"
dest = "$HOME/Games/Retrodeck/retrodeck/roms/apps/Switch.sh"

# --- Only desktop ---

[[components]]
name = "nvim"
packages = ["neovim"]
[[components.entries]]
src = "nvim/colors/caelestia.lua"
dest = "$XDG_CONFIG_HOME/nvim/colors/caelestia.lua"
[[components.entries]]
src = "nvim/lua/plugins/caelestia.lua"
dest = "$XDG_CONFIG_HOME/nvim/lua/plugins/caelestia.lua"

[[components]]
name = "rocm"
packages = ["rocm-hip-sdk", "rocm-opencl-sdk", "rocm-ml-sdk", "rocminfo", "rocm-smi-lib", "ollama-rocm"]
[[components.entries]]
src = "ollama/10-ollama.rules"
dest = "/etc/polkit-1/rules.d/10-ollama.rules"
sudo = true
[[components.entries]]
src = "ollama/override.conf"
dest = "/etc/systemd/system/ollama.service.d/override.conf"
sudo = true

[[components]]
name = "openrgb"
packages = [
    "openrgb-git",
    "caelestia-rgb-sync"
]
post_install = [
    "rm -f $XDG_CONFIG_HOME/caelestia-rgb/config.toml 2>/dev/null || true",
    "caelestia-rgb-sync init",
    "caelestia-rgb-sync calibrate device",
    "caelestia-rgb-sync calibrate global",
]
post_update = [
    "caelestia-rgb-sync apply",
]

[[components]]
name = "cortana"
packages = ["dotnet-sdk"]
post_install = [
    'git clone https://github.com/GwynnN7/Cortana "$HOME/Projects/Cortana" 2>/dev/null || git -C "$HOME/Projects/Cortana" pull',
    'mkdir -p "$HOME/Projects/Cortana/CortanaDesktop/out"',
    "systemctl --user daemon-reload",
    "systemctl --user enable cortana-desktop.service"
]
post_update = [
    'git clone https://github.com/GwynnN7/Cortana "$HOME/Projects/Cortana" 2>/dev/null || git -C "$HOME/Projects/Cortana" pull',
]
[[components.entries]]
src = "cortana/Settings.json"
dest = "$XDG_CONFIG_HOME/cortana/Settings.json"
[[components.entries]]
src = "cortana/cortana"
dest = "$XDG_BIN_HOME/cortana"
[[components.entries]]
src = "cortana/cortana-desktop.service"
dest = "$XDG_CONFIG_SERVICE/cortana-desktop.service"
[[components.entries]]
src = "cortana/efibootmgr"
dest = "/etc/sudoers.d/efibootmgr"
sudo = true